name: quality
on:
  push:
    branches: [main, zohtest]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify tests
        run: python -m pytest -q
      - name: Compile all source
        run: python -m compileall -q app.py agents challenge data orchestrator
