[theme]
base = "dark"
primaryColor = "#e3be72"
backgroundColor = "#171819"
secondaryBackgroundColor = "#202224"
textColor = "#f5f1e7"
font = "sans serif"

[client]
showErrorDetails = false

[server]
headless = true
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 20

[browser]
gatherUsageStats = false
