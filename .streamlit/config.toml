[theme]
base = "dark"
primaryColor = "#A4E8BF"
backgroundColor = "#0B1416"
secondaryBackgroundColor = "#122024"
textColor = "#F0F5EE"
font = "sans serif"

[client]
showErrorDetails = false

[server]
headless = true
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 20

[browser]
gatherUsageStats = false
